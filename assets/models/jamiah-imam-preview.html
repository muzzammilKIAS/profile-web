<!doctype html><html lang="ms"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jamiah Imam | 3D</title><script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script><style>body{margin:0;background:#f5f1e8;color:#25342f;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:30px}h1{font-family:Georgia,serif;margin:0}model-viewer{width:100%;height:70vh;min-height:330px;background:radial-gradient(ellipse,#fff,#e5ded0);border-radius:20px;--poster-color:transparent}p{color:#53625a}button{padding:10px 16px;border:1px solid #a69d8a;border-radius:8px;background:white;cursor:pointer}</style><main><h1>جامعة الإمام محمد بن سعود الإسلامية</h1><p>Riyadh · Interactive architectural miniature</p><model-viewer id="model" src="jamiah-imam.glb" alt="Model 3D Jamiah Imam" camera-controls auto-rotate auto-rotate-delay="1500" rotation-per-second="12deg" camera-orbit="25deg 65deg 42m" field-of-view="38deg" shadow-intensity="1" exposure="1" touch-action="pan-y" interaction-prompt="none"></model-viewer><p>Drag untuk putar 360° · Scroll atau pinch untuk zoom.</p><button id="toggle">Henti putaran automatik</button> <button id="reset">Reset kamera</button></main><script>const m=document.querySelector('#model');document.querySelector('#toggle').onclick=e=>{m.autoRotate=!m.autoRotate;e.target.textContent=m.autoRotate?'Henti putaran automatik':'Mulakan putaran automatik'};document.querySelector('#reset').onclick=()=>{m.cameraOrbit='25deg 65deg 42m';m.fieldOfView='38deg';m.jumpCameraToGoal()};</script></html>
